<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGY Todo</title>
  <script src="/preload.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,opsz,slnt,wdth,wght@0..100,6..144,-10..0,92..100,100..1000&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="root" class="pane-root">
    <section id="loading-state" class="loading" aria-live="polite" aria-busy="true">
      <div class="loading-header">
        <span class="skel" style="width: 140px; height: 18px;"></span>
        <span class="skel" style="width: 78px; height: 24px;"></span>
      </div>
      <div class="loading-section">
        <span class="skel" style="width: 48%; height: 22px;"></span>
        <span class="skel" style="width: 100%; height: 32px;"></span>
      </div>
      <div class="loading-section">
        <span class="skel" style="width: 24%; height: 12px;"></span>
        <span class="skel" style="width: 92%; height: 18px;"></span>
        <span class="skel" style="width: 78%; height: 18px;"></span>
      </div>
      <div class="loading-section">
        <span class="skel" style="width: 20%; height: 12px;"></span>
        <span class="skel" style="width: 100%; height: 96px;"></span>
      </div>
    </section>

    <section id="empty-state" class="empty-state" aria-label="No workspace open" hidden>
      <div class="empty-card">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect class="empty-icon-stroke" x="4" y="3" width="16" height="18" rx="2.5"></rect>
          <path class="empty-icon-stroke" d="M8 8.5h8M8 12.5h8M8 16.5h5"></path>
        </svg>
        <p class="empty-title">No workspace open</p>
        <p class="empty-description">
          Open a project folder or repository in Antigravity to load its personal links, todos, and notes.
        </p>
      </div>
    </section>

    <div id="app-shell" class="app-shell" hidden>
      <header id="app-header" class="app-header">
        <div class="project-identity">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <h1 id="project-name" class="project-name">Project</h1>
          <span id="workspace-select-wrap" class="select" hidden>
            <select id="workspace-select" class="workspace-select" aria-label="Switch active workspace" hidden></select>
          </span>
        </div>
        <div class="header-actions">
          <span id="save-status" class="save-status" aria-live="polite">Saved</span>
          <button id="export-btn" class="btn btn-secondary" type="button" title="Copy scratchpad as Markdown">Export .md</button>
        </div>
      </header>

      <section id="links-section" class="links-section" aria-label="Saved links">
        <div id="links-strip" class="links-strip">
          <div id="links-list" class="links-list"></div>
          <button id="toggle-link-form-btn" class="link-add-pill" type="button" aria-expanded="false" aria-controls="link-form">+ Link</button>
        </div>
        <form id="link-form" class="link-form" hidden>
          <div class="link-form-fields">
            <input id="link-label-input" class="input" type="text" placeholder="Label (optional)" aria-label="Link label" autocomplete="off">
            <input id="link-url-input" class="input" type="text" placeholder="https://… or localhost:3000" aria-label="Link URL" autocomplete="off" required>
          </div>
          <div class="link-form-actions">
            <span id="link-error" class="inline-error" role="alert" hidden></span>
            <div class="link-form-buttons">
              <button id="link-cancel-btn" class="btn btn-ghost" type="button">Cancel</button>
              <button id="link-submit-btn" class="btn btn-primary" type="submit">Add</button>
            </div>
          </div>
        </form>
      </section>

      <section id="todos-section" class="todos-section" aria-label="Todos">
        <div class="section-header">
          <div class="section-title-group">
            <h2 class="section-title">Todos</h2>
            <span id="todos-counts" class="todos-counts">0 open · 0 done</span>
          </div>
          <button id="clear-done-btn" class="btn btn-ghost btn-xs" type="button" hidden>Clear done</button>
        </div>
        <form id="todo-add-form" class="todo-add-form">
          <input id="todo-input" class="input todo-input" type="text" placeholder="+ Add todo…" aria-label="Add todo" autocomplete="off">
        </form>
        <ul id="todos-list" class="todos-list"></ul>
      </section>

      <section id="files-section" class="files-section" aria-label="Saved files">
        <div class="section-header files-header">
          <div class="section-title-group">
            <h2 class="section-title">Files</h2>
            <div class="segmented scope-tabs" role="tablist" aria-label="File storage scope">
              <button id="files-tab-project" class="scope-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="files-list" tabindex="0">Project</button>
              <button id="files-tab-global" class="scope-tab" type="button" role="tab" aria-selected="false" aria-controls="files-list" tabindex="-1">Global</button>
            </div>
          </div>
          <div class="files-toolbar">
            <button id="file-new-btn" class="btn btn-ghost btn-xs" type="button" aria-expanded="false" aria-controls="file-new-form">+ New .md</button>
            <button id="file-upload-btn" class="btn btn-ghost btn-xs" type="button">Upload</button>
            <button id="file-path-btn" class="btn btn-ghost btn-xs" type="button" aria-expanded="false" aria-controls="file-path-form">From Path</button>
            <button id="editor-settings-btn" class="btn btn-ghost btn-xs" type="button" aria-expanded="false" aria-controls="editor-settings-panel" title="External editor settings">Editor</button>
          </div>
          <input id="file-upload-input" type="file" multiple hidden>
        </div>

        <div id="editor-settings-panel" class="files-inline-form" hidden>
          <div class="editor-settings-row">
            <label class="editor-settings-label" for="editor-default-select">Default editor</label>
            <span class="select">
              <select id="editor-default-select" class="editor-select" aria-label="Default external editor">
                <option value="system">System Default</option>
                <option value="subl">Sublime Text</option>
                <option value="code">VS Code</option>
                <option value="cursor">Cursor</option>
                <option value="agy">Antigravity</option>
                <option value="custom">Custom Command</option>
              </select>
            </span>
          </div>
          <form id="editor-custom-form" class="editor-custom-form" hidden>
            <input id="editor-custom-input" class="input" type="text" placeholder="e.g. zed --wait" aria-label="Custom editor command" autocomplete="off">
            <button id="editor-custom-save-btn" class="btn btn-primary btn-xs" type="submit">Save</button>
          </form>
          <span id="editor-settings-error" class="inline-error" role="alert" hidden></span>
        </div>

        <form id="file-new-form" class="files-inline-form" hidden>
          <input id="file-new-name-input" class="input" type="text" placeholder="Filename (e.g. plan.md)" aria-label="New file name" autocomplete="off" required>
          <textarea id="file-new-content-input" class="input file-new-textarea" rows="3" placeholder="Markdown content…" aria-label="New file content"></textarea>
          <div class="link-form-actions">
            <span id="file-new-error" class="inline-error" role="alert" hidden></span>
            <div class="link-form-buttons">
              <button id="file-new-cancel-btn" class="btn btn-ghost btn-xs" type="button">Cancel</button>
              <button id="file-new-submit-btn" class="btn btn-primary btn-xs" type="submit">Save</button>
            </div>
          </div>
        </form>

        <form id="file-path-form" class="files-inline-form" hidden>
          <input id="file-path-input" class="input" type="text" placeholder="/path/to/file or ~/notes.md" aria-label="Local file path to import" autocomplete="off" required>
          <div class="link-form-actions">
            <span id="file-path-error" class="inline-error" role="alert" hidden></span>
            <div class="link-form-buttons">
              <button id="file-path-cancel-btn" class="btn btn-ghost btn-xs" type="button">Cancel</button>
              <button id="file-path-submit-btn" class="btn btn-primary btn-xs" type="submit">Import</button>
            </div>
          </div>
        </form>

        <div id="files-status" class="files-status" role="status" aria-live="polite" hidden></div>
        <div id="files-drop-hint" class="files-drop-hint" hidden>Drop files here to save</div>
        <ul id="files-list" class="files-list"></ul>
      </section>

      <section id="notes-section" class="notes-section" aria-label="Notes">
        <div class="section-header">
          <h2 class="section-title">Notes</h2>
          <button id="notes-mode-btn" class="btn btn-ghost btn-xs notes-mode-btn" type="button" aria-pressed="false" title="Toggle raw Markdown source">Source</button>
        </div>
        <div id="notes-editor" class="notes-editor" hidden></div>
        <textarea id="notes-input" class="notes-input" placeholder="Jot down project notes, commands, or reminders…" aria-label="Project notes"></textarea>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="/vendor/cm6-bundle.js"></script>
  <script src="/helpers.js"></script>
  <script src="/notes-editor.js"></script>
  <script src="/app.js"></script>
</body>
</html>
